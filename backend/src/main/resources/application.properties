spring.application.name=financial-platform

#PostGresSQL connection
spring.datasource.url=${DB_URL:jdbc:postgresql://localhost:5433/financial_platform}
spring.datasource.username=${DB_USERNAME:app_user}
spring.datasource.password=${DB_PASSWORD:local_dev_password}
spring.datasource.driver-class-name=org.postgresql.Driver

spring.jpa.hibernate.ddl-auto=validate
spring.jpa.show-sql=true

spring.flyway.enabled=true