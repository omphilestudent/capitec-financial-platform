spring.application.name=api-gateway
server.port=${GATEWAY_PORT:8000}

customer.service.url=${CUSTOMER_SERVICE_URL:http://localhost:8081}
account.service.url=${ACCOUNT_SERVICE_URL:http://localhost:8082}
transaction.service.url=${TRANSACTION_SERVICE_URL:http://localhost:8083}
case.service.url=${CASE_SERVICE_URL:http://localhost:8084}
fraud.service.url=${FRAUD_SERVICE_URL:http://localhost:8085}
notification.service.url=${NOTIFICATION_SERVICE_URL:http://localhost:8086}
statement.service.url=${STATEMENT_SERVICE_URL:http://localhost:8087}
aggregation.service.url=${AGGREGATION_SERVICE_URL:http://localhost:8088}

spring.cloud.gateway.server.webmvc.routes[0].id=customer-service
spring.cloud.gateway.server.webmvc.routes[0].uri=${customer.service.url}
spring.cloud.gateway.server.webmvc.routes[0].predicates[0]=Path=/api/v1/customers,/api/v1/customers/**

spring.cloud.gateway.server.webmvc.routes[1].id=account-service
spring.cloud.gateway.server.webmvc.routes[1].uri=${account.service.url}
spring.cloud.gateway.server.webmvc.routes[1].predicates[0]=Path=/api/v1/accounts,/api/v1/accounts/**

spring.cloud.gateway.server.webmvc.routes[2].id=transaction-service
spring.cloud.gateway.server.webmvc.routes[2].uri=${transaction.service.url}
spring.cloud.gateway.server.webmvc.routes[2].predicates[0]=Path=/api/v1/transactions,/api/v1/transactions/**

spring.cloud.gateway.server.webmvc.routes[3].id=case-service
spring.cloud.gateway.server.webmvc.routes[3].uri=${case.service.url}
spring.cloud.gateway.server.webmvc.routes[3].predicates[0]=Path=/api/v1/cases,/api/v1/cases/**

spring.cloud.gateway.server.webmvc.routes[4].id=fraud-detection-service
spring.cloud.gateway.server.webmvc.routes[4].uri=${fraud.service.url}
spring.cloud.gateway.server.webmvc.routes[4].predicates[0]=Path=/api/v1/fraud,/api/v1/fraud/**

spring.cloud.gateway.server.webmvc.routes[5].id=notification-service
spring.cloud.gateway.server.webmvc.routes[5].uri=${notification.service.url}
spring.cloud.gateway.server.webmvc.routes[5].predicates[0]=Path=/api/v1/notifications,/api/v1/notifications/**

management.endpoints.web.exposure.include=health,info
management.endpoint.health.show-details=always

spring.cloud.gateway.server.webmvc.routes[6].id=statement-service
spring.cloud.gateway.server.webmvc.routes[6].uri=${statement.service.url}
spring.cloud.gateway.server.webmvc.routes[6].predicates[0]=Path=/api/v1/statements,/api/v1/statements/**
spring.cloud.gateway.server.webmvc.routes[7].id=aggregation-service
spring.cloud.gateway.server.webmvc.routes[7].uri=${aggregation.service.url}
spring.cloud.gateway.server.webmvc.routes[7].predicates[0]=Path=/api/v1/aggregation,/api/v1/aggregation/**
