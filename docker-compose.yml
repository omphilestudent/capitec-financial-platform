  services:
    postgres:
      image: postgres:17
      container_name: capitec-postgres
      restart: unless-stopped
      environment:
        POSTGRES_DB: financial_platform
        POSTGRES_USER: app_user
        POSTGRES_PASSWORD: local_dev_password
      ports:
        - "5433:5432"
      volumes:
        - postgres_data:/var/lib/postgresql/data
      healthcheck:
        test: [ "CMD-SHELL", "pg_isready -U app_user -d financial_platform" ]
        interval: 10s
        timeout: 5s
        retries: 5

  volumes:
    postgres_data:
