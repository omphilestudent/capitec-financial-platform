spring.application.name=statement-service
server.port=${STATEMENT_SERVICE_PORT:8087}

spring.datasource.url=${DB_URL:jdbc:postgresql://localhost:5433/statement_service_db}
spring.datasource.username=${DB_USERNAME:app_user}
spring.datasource.password=${DB_PASSWORD}
spring.datasource.driver-class-name=org.postgresql.Driver

spring.jpa.hibernate.ddl-auto=validate
spring.jpa.open-in-view=false
spring.flyway.enabled=true

spring.kafka.bootstrap-servers=${KAFKA_BOOTSTRAP_SERVERS:localhost:9092}
spring.kafka.consumer.group-id=statement-service
spring.kafka.consumer.auto-offset-reset=earliest
spring.kafka.consumer.key-deserializer=org.apache.kafka.common.serialization.StringDeserializer
spring.kafka.consumer.value-deserializer=org.apache.kafka.common.serialization.StringDeserializer
spring.kafka.producer.key-serializer=org.apache.kafka.common.serialization.StringSerializer
spring.kafka.producer.value-serializer=org.apache.kafka.common.serialization.StringSerializer
spring.kafka.producer.acks=all
spring.kafka.producer.properties.enable.idempotence=true

management.endpoints.web.exposure.include=health,info
management.endpoint.health.show-details=always

account.service.url=${ACCOUNT_SERVICE_URL:http://localhost:8082}
transaction.service.url=${TRANSACTION_SERVICE_URL:http://localhost:8083}
customer.service.url=${CUSTOMER_SERVICE_URL:http://localhost:8081}

statement.storage.dir=${STATEMENT_STORAGE_DIR:${user.home}/capitec-private-statements}
statement.download.token-ttl-minutes=${STATEMENT_DOWNLOAD_TTL_MINUTES:5}
statement.max-custom-range-days=366

statement.security.jwt-secret=${STATEMENT_JWT_SECRET}
statement.security.jwt-issuer=${STATEMENT_JWT_ISSUER:capitec-fin-platform}

outbox.poll-interval-ms=1000
outbox.max-attempts=10
