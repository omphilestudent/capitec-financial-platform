spring.application.name=fraud-detection-service
server.port=${FRAUD_SERVICE_PORT:8085}

spring.datasource.url=${DB_URL:jdbc:postgresql://localhost:5433/fraud_detection_db}
spring.datasource.username=${DB_USERNAME:app_user}
spring.datasource.password=${DB_PASSWORD}
spring.datasource.driver-class-name=org.postgresql.Driver

spring.jpa.hibernate.ddl-auto=validate
spring.jpa.open-in-view=false
spring.flyway.enabled=true

spring.kafka.bootstrap-servers=${KAFKA_BOOTSTRAP_SERVERS:localhost:9092}
spring.kafka.producer.key-serializer=org.apache.kafka.common.serialization.StringSerializer
spring.kafka.producer.value-serializer=org.apache.kafka.common.serialization.StringSerializer
spring.kafka.producer.acks=all
spring.kafka.producer.properties.enable.idempotence=true
spring.kafka.consumer.group-id=fraud-detection-service
spring.kafka.consumer.key-deserializer=org.apache.kafka.common.serialization.StringDeserializer
spring.kafka.consumer.value-deserializer=org.springframework.kafka.support.serializer.ErrorHandlingDeserializer
spring.kafka.consumer.properties.spring.deserializer.value.delegate.class=org.springframework.kafka.support.serializer.JsonDeserializer
spring.kafka.consumer.auto-offset-reset=earliest
spring.kafka.consumer.properties.spring.json.use.type.headers=false
spring.kafka.consumer.properties.spring.json.trusted.packages=za.co.capitec.*

# Account service: the customer of a transaction's account is looked up here.
account.service.url=${ACCOUNT_SERVICE_URL:http://localhost:8082}

outbox.max-attempts=10

# Fraud rules. Thresholds and weights are configuration, not code.
fraud.rules.high-amount.enabled=true
fraud.rules.high-amount.threshold=50000
fraud.rules.high-amount.weight=70
fraud.rules.velocity.enabled=true
fraud.rules.velocity.max-transactions=5
fraud.rules.velocity.window-minutes=10
fraud.rules.velocity.weight=50
# Score boundaries: LOW below medium, MEDIUM, HIGH, CRITICAL from critical.
fraud.rules.levels.medium-min-score=30
fraud.rules.levels.high-min-score=60
fraud.rules.levels.critical-min-score=80

management.endpoints.web.exposure.include=health,info
management.endpoint.health.show-details=always

fraud.rules.cross-border.enabled=true
fraud.rules.cross-border.weight=60
fraud.rules.large-eft.enabled=true
fraud.rules.large-eft.threshold=20000
fraud.rules.large-eft.weight=65
